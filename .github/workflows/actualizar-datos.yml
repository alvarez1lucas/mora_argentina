name: Actualizar datos

on:
  schedule:
    - cron: "0 12 * * 1"   # lunes 9:00 ART; la ingesta sólo baja lo nuevo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Tests
        run: pytest -q

      - name: Ingesta
        run: python -m mora.ingest

      - name: Análisis descriptivo
        run: python -m mora.descriptivo

      - name: Modelo satélite
        run: python -m mora.satelite

      - name: Robustez de medición (tres mediciones de precios)
        run: python -m mora.robustez

      - name: Panel por entidad y ML causal
        run: |
          python -m mora.panel
          python -m mora.panel_ml

      - name: Rendimientos implícitos (Estado vs familias)
        run: python -m mora.rendimientos

      - name: Ponderación de canales
        run: python -m mora.canales

      - name: Ventana del ajuste (nov-23 en adelante)
        run: python -m mora.ajuste

      - name: Escenarios a 12 meses (Fase 6)
        run: python -m mora.escenarios

      - name: Capa de decisión (PD por escenario y tasa mínima de originación)
        run: python -m mora.decision

      - name: README e informe (cifras desde outputs)
        run: python -m mora.informe

      - name: Commit de datos nuevos
        run: |
          # El manifest cambia en cada corrida: sólo se commitea si cambió algún dato
          if git diff --quiet -- data/processed outputs README.md README_ES.md ':!data/processed/manifest.json' && \
             [ -z "$(git ls-files --others --exclude-standard data/processed outputs)" ]; then
            echo "Sin datos nuevos"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed outputs README.md README_ES.md
          git commit -m "Actualización automática de datos ($(date -u +%Y-%m-%d))"
          git push
