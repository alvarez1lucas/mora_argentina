name: Actualizar datos

on:
  schedule:
    - cron: "0 12 * * 1"   # lunes 9:00 ART; la ingesta sólo baja lo nuevo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Tests
        run: pytest -q

      - name: Ingesta
        run: python -m mora.ingest

      - name: Commit de datos nuevos
        run: |
          # El manifest cambia en cada corrida: sólo se commitea si cambió algún dato
          if git diff --quiet -- data/processed ':!data/processed/manifest.json' && \
             [ -z "$(git ls-files --others --exclude-standard data/processed)" ]; then
            echo "Sin datos nuevos"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed
          git commit -m "Actualización automática de datos ($(date -u +%Y-%m-%d))"
          git push
