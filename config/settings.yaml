# Configuración central del pipeline. Todo id de serie, URL y ruta sale de acá.

paths:
  raw: data/raw            # crudos pesados, no se versionan
  interim: data/interim    # extracciones temporales, no se versionan
  processed: data/processed  # series chicas ya procesadas, se versionan
  outputs: outputs         # resultados del análisis que lee el sitio web, se versionan

http:
  user_agent: "Mozilla/5.0 (mora-hogares-argentina; +https://github.com/alvarez1lucas)"
  timeout: 120
  retries: 4
  backoff: 2.0

sample:
  # Cada modelo se estima en las dos muestras y se comparan resultados.
  muestras:
    larga:
      inicio: "2010-01-01"
      nota: "Incluye 2010-2016 con deflactor empalmado (IPC 2007-2015 cuestionado): más observaciones, más ruido de medición."
    limpia:
      inicio: "2017-01-01"
      nota: "IPC INDEC base dic-2016 e índice de salarios disponibles: menos observaciones, medición confiable."
  principal: limpia

bcra_anexo:
  url: "https://www.bcra.gob.ar/archivos/Pdfs/PublicacionesEstadisticas/informes/informe-bancos-anexo.xlsx"
  sheet_lineas: "Calidad de Cartera (por líneas)"
  sheet_grupos: "Calidad de Cartera"
  sheet_balance: "Estado de Sit. Financiera ($)"   # moneda nacional, por grupo, mensual desde dic-2012

bcra_api:
  base_url: "https://api.bcra.gob.ar/estadisticas/v4.0/monetarias"
  page_size: 3000
  # nombre_interno: id de variable. Se agregan a fin de mes (ver `agg`).
  series:
    # Crédito (stocks)
    prestamos_personales:      {id: 114, agg: last}   # millones ARS, diario
    prestamos_tarjetas:        {id: 115, agg: last}   # millones ARS, diario
    prestamos_hipotecarios_ph: {id: 927, agg: last}   # miles ARS, mensual, personas humanas, ML
    prestamos_prendarios_ph:   {id: 960, agg: last}   # miles ARS, mensual, personas humanas, ML
    # Precios y tasas
    inflacion_mensual:         {id: 27,  agg: last}   # %
    tasa_prestamos_personales: {id: 14,  agg: mean}   # % TNA
    tasa_badlar_privados:      {id: 7,   agg: mean}   # % TNA
    tasa_tamar_privados:       {id: 44,  agg: mean}   # % TNA, desde oct-2024
    tasa_politica_monetaria:   {id: 160, agg: mean}   # % TNA, discontinuada jul-2025
    tipo_cambio_mayorista:     {id: 5,   agg: mean}   # ARS/USD
    tasa_pases_terceros_1d:    {id: 150, agg: mean}   # % TNA, proxy de la caución
    tasa_pases_terceros_1d_max: {id: 150, agg: max}   # máximo mensual (picos de iliquidez)
    reservas_internacionales:  {id: 1,   agg: last}   # millones USD, brutas
    # Liquidez / política monetaria (fase causal)
    base_monetaria:            {id: 15,  agg: mean}   # millones ARS
    m2:                        {id: 109, agg: mean}   # millones ARS
    depositos_ef_en_bcra:      {id: 19,  agg: mean}   # millones ARS, proxy de integración de encajes
    depositos_gobierno_en_bcra: {id: 1264, agg: mean} # millones ARS, proxy de absorción vía Tesoro
    efecto_bm_compras_tesoro:  {id: 48,  agg: sum}    # millones ARS, flujo diario
    efecto_bm_adelantos_tesoro: {id: 49, agg: sum}
    efecto_bm_utilidades_tesoro: {id: 50, agg: sum}
    efecto_bm_resto_tesoro:    {id: 51,  agg: sum}
    efecto_bm_pases:           {id: 52,  agg: sum}
    efecto_bm_leliq:           {id: 53,  agg: sum}
    efecto_bm_intereses_bcra:  {id: 55,  agg: sum}    # intereses y primas de pases/LELIQ y remuneración de cuentas corrientes

datos_gob:
  base_url: "https://apis.datos.gob.ar/series/api/series/"
  series:
    ipc_nacional:        "148.3_INIVELNAL_DICI_M_26"     # INDEC, base dic-2016, mensual
    salarios_registrados: "149.1_TL_REGIADO_OCTU_0_16"   # INDEC, índice de salarios registrados
    # RIPTE (158.1_REPTE_0_0_5) figura en el catálogo pero la API lo devuelve vacío (oct-2026).
    emae_desest:         "143.3_NO_PR_2004_A_31"         # INDEC, EMAE desestacionalizado
    empleo_registrado:   "151.1_TL_SIN_TAC_2012_M_15"    # SIPA, total de trabajadores registrados, sin estacionalidad
    # IPC de la Ciudad de Buenos Aires (IDECBA): base jul-11/jun-12 (2012-07 a 2022-02) y base 2021 (2022-02 en adelante)
    ipcba_general_b2012:   "193.1_NIVEL_GENERAL_JULI_0_13"
    ipcba_general_b2021:   "193.2_NIVEL_GENERAL_2021_0_13_2"
    # ipcba_regulados_b2012 (193.1_REGULADOSDOS_JULI_0_9) figura en el catálogo pero la API lo devuelve vacío
    ipcba_vivienda_b2012:  "193.1_VIVIENDA_ALES_JULI_0_45"
    desocupacion:        "42.3_EPH_PUNTUATAL_0_M_30"     # INDEC, EPH, trimestral
    pbi_nominal:         "166.2_PPIB_0_0_3"              # INDEC, PIB a precios corrientes, millones de $, trimestral a tasa anual
    pbi_real:            "4.2_OGP_2004_T_17"             # INDEC, PIB a precios de 2004, trimestral (llega más lejos que el nominal)
    # Futuro de dólar ROFEX, diario, discontinuado en abr-2024 (2020+ sale de A3 Mercados).
    # "1M" = contrato más próximo a vencer (vence a fin de mes), no plazo constante.
    futuro_dolar_1m:     "168.1_FRO_ROF1M_D_0_0_19"
    futuro_dolar_2m:     "168.1_FRO_ROF2M_D_0_0_19"
    futuro_dolar_3m:     "168.1_FRO_ROF3M_D_0_0_19"
    interes_abierto_1m:  "168.1_IRES_AB_1M_D_0_0_18"
    interes_abierto_2m:  "168.1_IRES_AB_2M_D_0_0_18"
    # interes_abierto_3m (168.1_IRES_AB_3M_D_0_0_18) figura en el catálogo pero la API lo devuelve vacío

entidades:
  api_url: "https://www.bcra.gob.ar/api/endpoints/informacion-entidades.php"
  first_month: "2011-01"
  keep_archives: false   # borrar el 7z después de extraer lo necesario (--keep-archives lo pisa)
  # Variables de `indicad` y `esd`, identificadas por la DESCRIPCIÓN (regex, sin distinguir mayúsculas).
  # Los códigos de `indicad` cambiaron de significado entre ene-2014 y jun-2014; las descripciones no.
  variables:
    # indicad, esquema nuevo (desde 2014-06)
    a9_irregular_total: "^A9 - Total Cartera Irregular"
    a11_irregular_privado: "^A11 - Cartera Irregular Sector Privado"
    a13_part_consumo: "^A13 - Participaci.n Cartera Consumo"
    a14_previsiones_irregular: "^A14 - Previsiones sobre Cartera Irregular"
    a16_irregular_consumo: "^A16 - Cartera Irregular Consumo"
    a17_irregular_comercial: "^A17 - Cartera Irregular Comercial"
    # indicad, esquema viejo (hasta 2014-01): A12 equivale a A16
    a10_irregular_total_viejo: "^A10 - Cartera irregular sobre financiaciones"
    a12_irregular_consumo_viejo: "^A12 - Cartera de Consumo irregular"
    # esd: cartera de consumo o vivienda (saldo y % por situación), estable 2011-2026
    esd_consumo_saldo: "^CARTERA DE CONSUMO O VIVIENDA"
    esd_consumo_sit1: "^C\\.CON\\.Sit\\.1"
    esd_consumo_sit2: "^C\\.CON\\.Sit\\.2"
    esd_consumo_sit3: "^C\\.CON\\.Sit\\.3"
    esd_consumo_sit4: "^C\\.CON\\.Sit\\.4"
    esd_consumo_sit5: "^C\\.CON\\.Sit\\.5"
  valor_centinela: 99999   # el BCRA usa 99999 para "no aplica"
  # Agregados del balance por entidad: suma de cuentas hoja por prefijo, filtradas por descripción.
  # Aproximación (moneda nacional + extranjera); ver docs/relevamiento_datos.md.
  agregados_balance:
    activo_total: {prefijo: "1"}
    titulos_publicos_bcra: {prefijo: "12", incluye: "P[UÚ]B|BCRA|B\\.C\\.R\\.A|LEBAC|LELIQ|LEFI|LETRAS|NOTAS|BONO|BGN|LECAP|TESORO", excluye: "PRIVAD"}
    pases_activos: {prefijo: "14", incluye: "PASE"}
    prestamos_total: {prefijo: "13"}
    # Moneda nacional (121 títulos, 141 otros créditos por intermediación, 311 depósitos)
    titulos_publicos_mn: {prefijo: "121", incluye: "P[UÚ]B|BCRA|B\\.C\\.R\\.A|LEBAC|LELIQ|LEFI|LETRAS|NOTAS|BONO|BGN|LECAP|TESORO", excluye: "PRIVAD"}
    pases_activos_mn: {prefijo: "141", incluye: "PASE"}
    depositos_mn: {prefijo: "311"}
    # Resultados (acumulados en el ejercicio): costo de los depósitos en pesos
    costo_depositos_mn: {prefijo: "521", incluye: "DEP|PLAZO|AHORRO|CTAS|UVA", excluye: "T[IÍ]TULO"}
  # Cuentas individuales de `bal_hist` que se conservan (varias cuentas con el mismo nombre se suman)
  cuentas_balance:
    # Resultados en pesos, acumulados en el ejercicio (ingresos con signo negativo)
    "511021": res_titulos_publicos_mn       # intereses por títulos públicos
    "511075": res_titulos_publicos_mn       # ajustes CER de títulos públicos
    "511505": res_titulos_publicos_mn       # resultado por medición de títulos públicos
    "511027": res_pases_bcra_mn             # intereses por pases activos con el BCRA
    "511108": res_pases_bcra_mn
    "511107": res_prestamos_personales
    "511054": res_tarjetas
    "711046": irrecuperables_cuentas_orden
    "131731": prestamos_personales
    "131732": prestamos_personales_monto_reducido
    "131749": prestamos_personales_uva
    "131742": prestamos_tarjetas
    "131708": hipotecarios_vivienda
    "131713": prendarios_automotores

rendimientos:
  desde: "2017-01-01"
  reexpresion_desde: "2020-01-01"   # NIC 29: balances reexpresados por inflación (Com. A 6651)

transparencia:
  base_url: "https://api.bcra.gob.ar/transparencia/v1.0"
  productos: [Personales, Prendarios, Hipotecarios]
  antiguedad_max_dias: 180

a3:
  url: "https://apicem.matbarofex.com.ar/api/v2/closing-prices"
  page_size: 500
  inicio: "2020-01-01"

descriptivo:
  # Agrupamientos institucionales del BCRA (archivos AA de Información de Entidades Financieras)
  grupos:
    AA000: sistema_financiero
    AA110: bancos_publicos
    AA121: bancos_privados_nacionales
    AA123: bancos_privados_extranjeros
    AA200: companias_financieras

satelite:
  ar_max: 2
  ventana_expectativa_inflacion: 3   # meses; inflación reciente anualizada como expectativa (hasta tener el REM)
  meses_post_covid_excluidos: 6
  # +1: más mora; -1: menos mora; 0: sin restricción. Tasa real más alta, más mora; más ingreso o
  # actividad, menos mora. El crédito previo tiene dos efectos opuestos (dilución del denominador
  # vs cosecha) y su signo es una pregunta empírica: queda libre.
  signos_esperados: {tasa_real_cft: 1, salario_real_ia: -1, empleo_ia: -1, emae_ia: -1, credito_real_ia: 0}
  min_train: 48          # meses mínimos antes del primer pronóstico fuera de muestra
  horizontes: [1, 3, 6, 12]
  especificaciones:
    # Grillas de rezagos acotadas por criterio económico (meses). Dentro de la grilla elige el BIC.
    base:
      muestras: [larga, limpia]
      grilla:
        tasa_real_cft: [3, 6, 9, 12]
        empleo_ia: [3, 6, 9]
        emae_ia: [3, 6, 9]
        credito_real_ia: [12, 15, 18]
    completa:
      muestras: [limpia]
      grilla:
        tasa_real_cft: [3, 6, 9, 12]
        salario_real_ia: [3, 6, 9]
        emae_ia: [3, 6, 9]
        credito_real_ia: [12, 15, 18]

indec_ipc:
  url_divisiones: "https://www.indec.gob.ar/ftp/cuadros/economia/serie_ipc_divisiones.csv"

deflactores:
  # Estructura del gasto de consumo de los hogares, total país, ENGHo 2017-2018 (%), por división COICOP.
  # Fuente: INDEC, ENGHo 2017-2018, Informe de gastos (resultados definitivos), gráfico de estructura por región.
  # https://www.indec.gob.ar/ftp/cuadros/sociedad/engho_2017_2018_informe_gastos.pdf
  engho_2017_18:
    "01": 22.7   # Alimentos y bebidas no alcohólicas
    "02": 1.9    # Bebidas alcohólicas y tabaco
    "03": 6.8    # Prendas de vestir y calzado
    "04": 14.5   # Vivienda, agua, electricidad, gas y otros combustibles
    "05": 5.4    # Equipamiento y mantenimiento del hogar
    "06": 6.4    # Salud
    "07": 14.3   # Transporte
    "08": 5.2    # Comunicación
    "09": 8.6    # Recreación y cultura
    "10": 3.1    # Educación
    "11": 6.6    # Restaurantes y hoteles
    "12": 4.3    # Bienes y servicios varios
  # Período de relevamiento de la ENGHo (para llevar las participaciones a precios de la base dic-2016)
  engho_periodo: ["2017-11-01", "2018-11-01"]
  region: nacional
  # Deflactor que usa el resto del pipeline por defecto ("publico", "seleccionado" o "mix")
  principal: publico

panel:
  meses_minimos: 36                 # historia mínima por entidad
  recorte_crecimiento: [-100, 200]  # % real interanual; fuera de rango = fusiones o entidades muy chicas
  evento:
    fecha: "2025-07-01"             # fin de las LEFI y comienzo del apretón de encajes (ver eventos_monetarios.yaml)
    fecha_exposicion: "2025-06-01"  # exposición al sector público medida antes del evento
    ventana: [-12, 12]              # meses relativos al evento

panel_ml:
  corte_alerta_temprana: "2024-01-01"   # se entrena con orígenes hasta 12 meses antes y se evalúa desde acá

canales:
  inicio: "2017-01-01"            # muestra limpia: la única con salario real
  buscar_minimo_desde: "2024-01-01" # la ventana de atribución arranca en el mínimo de la mora desde esta fecha
  variantes:
    base:
      grilla:
        salario_real_ia: [3, 6, 9]
        tasa_real_cft: [3, 6, 9, 12]
        absorcion_d12: [3, 6, 9, 12]
        tcr_ia: [3, 6, 9, 12]
        credito_real_ia: [12, 15, 18]
    # Mediación: el costo financiero separado en tasa de fondeo (la que mueve la política monetaria:
    # esterilización, encajes, ancla) y spread de la tasa a familias sobre el fondeo (riesgo y costos)
    costo_dividido:
      grilla:
        salario_real_ia: [3, 6, 9]
        tasa_real_fondeo: [3, 6, 9, 12]
        spread_personales: [3, 6, 9, 12]
        absorcion_d12: [3, 6, 9, 12]
        tcr_ia: [3, 6, 9, 12]
        credito_real_ia: [12, 15, 18]
    # Costo de oportunidad: la tasa a familias separada en lo que rinde prestarle al Estado (títulos +
    # pases en pesos, rendimiento implícito del balance) y la prima que el banco cobra por encima
    costo_oportunidad:
      grilla:
        salario_real_ia: [3, 6, 9]
        tasa_real_estado: [3, 6, 9, 12]
        prima_sobre_estado: [3, 6, 9, 12]
        absorcion_d12: [3, 6, 9, 12]
        tcr_ia: [3, 6, 9, 12]
        credito_real_ia: [12, 15, 18]
  # más absorción del sector público/BCRA, más mora; fondeo y spread más altos, más mora;
  # el tipo de cambio real no tiene signo teórico único
  signos_esperados: {absorcion_d12: 1, tcr_ia: 0, tasa_real_fondeo: 1, spread_personales: 1, tasa_real_estado: 1, prima_sobre_estado: 1}
  # Valor neutral de cada canal en el contrafáctico: variaciones en 0; la tasa real en su promedio previo a la ventana
  referencias:
    salario_real_ia: 0
    tasa_real_cft: media_previa
    absorcion_d12: 0
    tcr_ia: 0
    credito_real_ia: 0
    tasa_real_fondeo: media_previa
    spread_personales: media_previa
    tasa_real_estado: media_previa
    prima_sobre_estado: media_previa

ajuste:
  desde: "2023-11-01"     # ventana principal del análisis: desde el mes previo a la devaluación de dic-2023
  meses_castigos: 8

escenarios:
  modelos: [satelite, canales]   # satelite = principal (validado fuera de muestra); canales = referencia
  horizonte_meses: 12
  # Tasas reales: se quedan en el promedio de 3 meses en el base. El resto son variaciones interanuales.
  variables_nivel: [tasa_real_cft, absorcion_d12]
  meses_convergencia: 12        # base: las variaciones interanuales vuelven a cero en este plazo
  cuantil_shock: 0.9            # adverso/favorable: percentil 90/10 de los cambios a 12 meses de cada variable
  meses_rampa: 6                # el shock entra de forma gradual
  simulaciones: 2000
  semilla: 20261027
  # Pesos de los escenarios para la pérdida esperada forward-looking (práctica habitual de NIIF 9)
  pesos_niif9: {base: 0.6, adverso: 0.25, favorable: 0.15}

sitio:
  destino: site                  # GitHub Pages publica esta carpeta (workflow de Pages)
  repo_url: "https://github.com/alvarez1lucas/mora-hogares-argentina"   # se confirma al crear el repo
  url: "https://alvarez1lucas.github.io/mora-hogares-argentina/"

# Análisis complementarios (mora.complementos): fuera del sitio, el README y el workflow semanal
complementos:
  ardl:
    muestras: [larga, limpia]
    regresores: [tasa_real_cft, log_salario_real, log_credito_real]
    max_rezago: 6
  proyecciones_locales:
    horizontes: 18
    rezagos: 3
    # shock: controles (en rezagos)
    shocks:
      tasa_real_cft: [salario_real_ia, emae_ia]
      salario_real_ia: [tasa_real_cft, emae_ia]
  bootstrap_canales:
    variantes: [base, costo_oportunidad]
    repeticiones: 300
    bloque_meses: 12
    semilla: 20261028
